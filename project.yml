# XcodeGen spec — the single source of truth for the Xcode project.
# Regenerate DockNearby.xcodeproj after editing:  xcodegen generate
name: DockNearby

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    # ---- Set these three before running on a device -------------------
    DEVELOPMENT_TEAM: 84LP9M3UUC                  # Nicholas Shampoe (Personal Team)
    BASE_BUNDLE_ID: com.nick.docknearby           # app ID; widget appends .DockWidget
    APP_GROUP_ID: group.com.nick.docknearby       # must match in the Developer portal
    # --------------------------------------------------------------------
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

packages:
  BikeKit:
    path: BikeKit

targets:
  DockNearby:
    type: application
    platform: iOS
    sources: [DockNearby, Shared]
    scheme: {}                      # shared scheme, so it's generated rather than auto-created
    dependencies:
      - package: BikeKit
      - target: DockWidget          # embeds the widget extension in the app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"   # iPhone only (target level overrides XcodeGen's default)
    info:
      path: DockNearby/Info.plist
      properties:
        CFBundleDisplayName: Park It
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocationWhenInUseUsageDescription: Find the Citi Bike stations near you
        AppGroupID: $(APP_GROUP_ID)
    entitlements:
      path: DockNearby/DockNearby.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]

  DockWidget:
    type: app-extension
    platform: iOS
    sources: [DockWidget, Shared]
    scheme:
      # Running this scheme shows the widget directly. Xcode's default is the home
      # screen medium size, which this widget doesn't support.
      environmentVariables:
        _XCWidgetKind: DockWidget
        _XCWidgetFamily: accessoryRectangular
    dependencies:
      - package: BikeKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_ID).DockWidget
    info:
      path: DockWidget/Info.plist
      properties:
        CFBundleDisplayName: Park It
        NSWidgetWantsLocation: true
        NSLocationWhenInUseUsageDescription: Find the Citi Bike stations near you
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: DockWidget/DockWidget.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
